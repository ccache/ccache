name: Verify Remote Storage

on:
  pull_request:
    paths:
      - .github/actions/gha-proof-support/**
      - .github/actions/ghcr-proof-support/**
      - .github/workflows/verify-remote-storage.yml
      - scripts/ci/ci.sh
      - scripts/ci/ci.bats
      - src/ccache/storage/**
      - src/ccache/util/exec.*
      - test/ccache_cache_test/proof.c
      - test/suites/remote_oci.bash
      - test/gha-cache-server
  workflow_dispatch:
    inputs:
      phase:
        description: GHA phase. Verify writes then reads with a fresh local cache.
        required: true
        default: verify
        type: choice
        options:
          - verify
          - write
          - read
      proof_id:
        description: Non-secret GHA identifier for a paired manual write and read.
        required: true
        type: string
      remote_debug:
        description: Enable redacted GHA backend diagnostics.
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build g++ redis-server redis-tools

      - name: Build remote storage verification binary
        run: bash scripts/ci/ci.sh remote-storage-build

      - name: Verify GHA cache storage
        uses: ./.github/actions/gha-proof-support
        env:
          GHA_PROOF_CCACHE: ${{ github.workspace }}/build-remote-storage/ccache
          GHA_PROOF_PHASE: ${{ inputs.phase || 'verify' }}
          GHA_PROOF_ID: ${{ inputs.proof_id || github.event.pull_request.head.sha }}
          GHA_PROOF_REMOTE_DEBUG: ${{ inputs.remote_debug }}

      - name: Verify local OCI storage integration
        env:
          CCACHE_NG_REMOTE_STORAGE_BUILD_DIR: ${{ github.workspace }}/build-remote-storage
        run: bash scripts/ci/ci.sh oci-remote-storage

      - name: Create GHCR systemd credential source
        id: credential
        uses: ./.github/actions/ghcr-proof-support
        with:
          operation: create
          token: ${{ github.token }}
          repository-name: ${{ github.event.repository.name }}

      - name: Verify GHCR write and read through systemd credentials
        env:
          CCACHE_NG_GHCR_CREDENTIAL_FILE: ${{ steps.credential.outputs.credential-file }}
          CCACHE_NG_GHCR_PROOF_ID: ghcr-${{ github.run_id }}
          CCACHE_NG_GHCR_REPOSITORY: ${{ steps.credential.outputs.repository }}
          CCACHE_NG_REMOTE_STORAGE_BUILD_DIR: ${{ github.workspace }}/build-remote-storage
        run: bash scripts/ci/ci.sh ghcr-remote-storage

      - name: Remove this run's GHCR test package
        if: always()
        uses: ./.github/actions/ghcr-proof-support
        with:
          operation: cleanup
          token: ${{ github.token }}
          credential-directory: ${{ steps.credential.outputs.credential-directory }}
          package-name: ${{ steps.credential.outputs.package-name }}
