name: Verify GHA Remote Storage

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Run A writes a cache entry; Run B reads the same entry.
        required: true
        default: write
        type: choice
        options:
          - write
          - read
      proof_id:
        description: Non-secret identifier shared by the paired write and read runs.
        required: true
        type: string
      remote_debug:
        description: Enable redacted GHA backend diagnostics.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build g++

      - name: Run selected GHA cache phase
        uses: actions/github-script@v8
        env:
          GHA_PROOF_PHASE: ${{ inputs.phase }}
          GHA_PROOF_ID: ${{ inputs.proof_id }}
          GHA_PROOF_REMOTE_DEBUG: ${{ inputs.remote_debug }}
        with:
          script: |
            require("child_process").execFileSync("bash", ["scripts/ci/ci.sh", "gha-remote-storage"], {stdio: "inherit"});
