name: Verify GHA Remote Storage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build g++

      - name: Build ccache with strict release settings
        run: |
          set -euo pipefail
          cmake -S . -B build-gha-proof -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCCACHE_DEV_MODE=ON \
            -DWARNINGS_AS_ERRORS=ON \
            -DENABLE_IPO=ON \
            -DGHA_STORAGE_BACKEND=ON \
            -DOCI_STORAGE_BACKEND=ON
          cmake --build build-gha-proof --target ccache -j12

      - name: Prove cold write and warm remote hit
        uses: actions/github-script@v8
        with:
          script: |
            const childProcess = require("child_process");
            const fs = require("fs");
            const path = require("path");

            if (!(process.env.ACTIONS_RESULTS_URL || process.env.ACTIONS_CACHE_URL)) {
              throw new Error("No GitHub Actions cache endpoint is available");
            }
            if (!process.env.ACTIONS_RUNTIME_TOKEN) {
              throw new Error("ACTIONS_RUNTIME_TOKEN is unavailable");
            }

            const proofRoot = path.join(process.env.RUNNER_TEMP, "ccache-ng-gha-proof-work");
            const cacheDir = path.join(process.env.RUNNER_TEMP, "ccache-ng-gha-proof");
            const ccache = path.join(process.env.GITHUB_WORKSPACE, "build-gha-proof", "ccache");
            const environment = {
              ...process.env,
              CCACHE_DIR: cacheDir,
              CCACHE_BASEDIR: proofRoot,
              CCACHE_REMOTE_STORAGE: "gha://workflow-proof @service-version=v2 @debug=false",
            };
            const run = (file, args) => childProcess.execFileSync(file, args, {
              cwd: process.env.GITHUB_WORKSPACE,
              env: environment,
              stdio: "inherit",
            });
            const stat = (name) => childProcess.execFileSync(ccache, ["--print-stats"], {
              encoding: "utf8",
              env: environment,
            }).split("\n").find((line) => line.startsWith(`${name} `))?.split(/\s+/)[1];
            const requirePositive = (name, value) => {
              if (!/^[1-9][0-9]*$/.test(value || "")) {
                throw new Error(`${name} must be positive`);
              }
            };

            try {
              fs.mkdirSync(proofRoot, {recursive: true});
              fs.writeFileSync(path.join(proofRoot, "proof.c"), "int main(void) { return 0; }\n");
              run(ccache, ["--clear"]);
              run(ccache, ["--zero-stats"]);
              run(ccache, ["gcc", "-c", path.join(proofRoot, "proof.c"), "-o", path.join(proofRoot, "cold.o")]);
              const coldWrites = stat("remote_storage_write");
              requirePositive("cold remote storage writes", coldWrites);

              run(ccache, ["--clear"]);
              run(ccache, ["--zero-stats"]);
              fs.rmSync(path.join(proofRoot, "cold.o"), {force: true});
              run(ccache, ["gcc", "-c", path.join(proofRoot, "proof.c"), "-o", path.join(proofRoot, "warm.o")]);
              const warmHits = stat("remote_storage_hit");
              requirePositive("warm remote storage hits", warmHits);
              await core.summary.addRaw(
                `GHA_REMOTE_PROOF cold_remote_writes=${coldWrites} warm_remote_hits=${warmHits} local_cache_cleared=yes\n`
              ).write();
            } finally {
              fs.rmSync(cacheDir, {recursive: true, force: true});
              fs.rmSync(proofRoot, {recursive: true, force: true});
            }
