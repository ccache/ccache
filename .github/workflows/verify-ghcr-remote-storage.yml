name: Verify GHCR Remote Storage

on:
  pull_request:
    paths:
      - .github/actions/ghcr-proof-support/**
      - .github/workflows/verify-ghcr-remote-storage.yml
      - scripts/ci/ci.sh
      - src/ccache/storage/**
      - src/ccache/util/exec.*
      - test/ccache_cache_test/proof.c
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build g++

      - name: Verify GHCR write and read through systemd credentials
        uses: actions/github-script@v8
        with:
          script: |
            const child = require("child_process");
            const fs = require("fs");
            const os = require("os");
            const path = require("path");
            const root = fs.mkdtempSync(path.join(os.tmpdir(), "ccache-ng-ghcr-"));
            const credential = path.join(root, "ghcr-token");
            const proofId = `ghcr-${context.runId}`;
            const repository = "ghcr.io/wiki-mod/ccache-ng/ccache-remote-storage-test";
            const safeEnv = {PATH: process.env.PATH, HOME: process.env.HOME, RUNNER_TEMP: process.env.RUNNER_TEMP};
            fs.writeFileSync(credential, JSON.stringify({Username: context.actor, Secret: process.env.GITHUB_TOKEN}), {mode: 0o600});
            fs.chmodSync(root, 0o700);
            try {
              child.execFileSync("bash", ["scripts/ci/ci.sh", "ghcr-remote-storage-build"], {stdio: "inherit", env: safeEnv});
              for (const phase of ["write", "read"]) {
                const cacheDir = path.join(root, `${phase}-cache`);
                child.execFileSync("sudo", ["systemd-run", "--wait", "--collect", "--quiet", `--property=User=${process.env.USER}`, `--property=LoadCredential=ghcr-token:${credential}`, `--setenv=CCACHE_DIR=${cacheDir}`, `--setenv=CCACHE_NG_GHCR_PHASE=${phase}`, `--setenv=CCACHE_NG_GHCR_PROOF_ID=${proofId}`, `--setenv=CCACHE_NG_GHCR_REPOSITORY=${repository}`, "bash", "scripts/ci/ci.sh", "ghcr-remote-storage-service"], {stdio: "inherit", env: safeEnv});
              }
            } finally {
              fs.rmSync(root, {recursive: true, force: true});
            }
